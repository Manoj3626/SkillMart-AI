[project]
name = "skillmatch-agent"
version = "0.1.0"
description = "SkillMatch AI — LiveKit Interview Agent"
requires-python = ">=3.11"

[project.dependencies]
livekit-agents = ">=0.8"
livekit-plugins-google = ">=0.1"
livekit-plugins-openai = ">=0.1"
livekit-plugins-silero = ">=0.1"
python-dotenv = ">=1.0"
aiohttp = ">=3.9"

[project.scripts]
agent = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
